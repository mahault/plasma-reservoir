[project]
name = "plasma-rc"
version = "0.1.0"
description = "Plasma reservoir computing with Bayesian network readouts"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
acquisition = [
    "pyserial>=3.5",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "pydub>=0.25",
]

[tool.setuptools.packages.find]
include = ["plasma_rc*"]

[tool.setuptools.package-data]
"plasma_rc.acquisition" = ["config.yaml"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
