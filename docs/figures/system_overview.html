<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Physical system overview</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet"><style>
:root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --accent:#bf4520; --tint:#f4e7e2; --font-sans:'Geist',system-ui,sans-serif; --font-mono:'Geist Mono',ui-monospace,monospace; --font-serif:'Instrument Serif',Georgia,serif; }
* { box-sizing:border-box; } body { margin:0; padding:24px; background:var(--paper); color:var(--ink); font-family:var(--font-sans); }
.frame { width:100%; max-width:1040px; min-width:0; margin:0 auto; } .diagram-container { width:100%; overflow-x:auto; } svg { width:100%; min-width:960px; display:block; }
h1 { font-family:var(--font-serif); font-weight:400; font-size:28px; margin:0 0 16px; } .note { font-size:14px; line-height:1.6; max-width:80ch; }
svg .paper { fill:var(--paper); } svg text { fill:var(--ink); font-family:var(--font-sans); } svg .figure-title { font-family:var(--font-serif); font-size:28px; font-weight:400; }
svg .name { font-size:12px; font-weight:600; } svg .sub { font-family:var(--font-mono); font-size:9px; fill:var(--muted); } svg .tag { font-family:var(--font-mono); font-size:8px; letter-spacing:1px; fill:var(--soft); }
svg .group { font-size:14px; font-weight:600; } svg .small { font-size:11px; fill:var(--muted); } svg .box { fill:var(--paper); stroke:var(--muted); stroke-width:1.2; } svg .focal { fill:var(--tint); stroke:var(--accent); stroke-width:1.8; }
svg .zone { fill:#f0f0f1; stroke:#bfc0c0; stroke-width:1; stroke-dasharray:4 4; } svg .wire { fill:none; stroke:var(--muted); stroke-width:1.4; marker-end:url(#arrow); }
svg .secondary { fill:none; stroke:var(--muted); stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#arrow); } svg .rule { stroke:#bfc0c0; stroke-width:1; }
@media print { body{padding:0} .diagram-container{overflow-x:visible} svg{min-width:0} }
</style></head><body><main class="frame"><h1>Physical system overview</h1><div class="diagram-container"><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system_overview-title system_overview-desc"><title id="system_overview-title">Physical system overview</title><desc id="system_overview-desc">Known input excites the biased NE-2 circuit, sensors feed the acquisition board, and the host saves a traceable trial.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker></defs><rect width="960" height="600" class="paper"/><text x="32" y="40" class="figure-title" text-anchor="start">One lamp, three measurements, one recorded trial</text><text x="32" y="64" class="small" text-anchor="start">Physical signal path · nominal Teensy 4.1 arrangement</text><rect x="496" y="88" width="240" height="280" rx="8" class="zone"/><rect x="512" y="92" width="128" height="16" class="paper"/><text x="576.0" y="103" class="tag" text-anchor="middle">BIASED CIRCUIT</text><path d="M216 280H272" class="wire"/><path d="M456 280H520" class="wire"/><path d="M712 280H768" class="wire"/><path d="M616 204V232" class="wire"/><path d="M848 328V416" class="wire"/><path d="M768 460H712" class="wire"/><rect x="712" y="256" width="56" height="16" class="paper"/><text x="740.0" y="267" class="tag" text-anchor="middle">SENSING</text><rect x="856" y="364" width="68" height="16" class="paper"/><text x="890.0" y="375" class="tag" text-anchor="middle">SAMPLES</text><g data-node-id="bias"><rect data-role="bounds" x="520" y="124" width="192" height="80" rx="6" class="box"/><text x="536" y="144" class="tag" text-anchor="start">BIAS</text><text x="536" y="168" class="name" text-anchor="start">Supply and bias</text><text x="536" y="188" class="sub" text-anchor="start">V_s · R_f / C_f · R_s</text></g><g data-node-id="input"><rect data-role="bounds" x="32" y="232" width="184" height="96" rx="6" class="box"/><text x="48" y="252" class="tag" text-anchor="start">INPUT</text><text x="48" y="276" class="name" text-anchor="start">Known input</text><text x="48" y="296" class="sub" text-anchor="start">Board: steps / sine</text><text x="48" y="310" class="sub" text-anchor="start">Laptop: current speech</text></g><g data-node-id="drive"><rect data-role="bounds" x="272" y="232" width="184" height="96" rx="6" class="box"/><text x="288" y="252" class="tag" text-anchor="start">DRIVE</text><text x="288" y="276" class="name" text-anchor="start">Protected coupling</text><text x="288" y="296" class="sub" text-anchor="start">R_e + C_c</text><text x="288" y="310" class="sub" text-anchor="start">DC block; signal injection</text></g><g data-node-id="reservoir"><rect data-role="bounds" x="520" y="232" width="192" height="96" rx="6" class="focal"/><text x="536" y="252" class="tag" text-anchor="start">RESERVOIR</text><text x="536" y="276" class="name" text-anchor="start">NE-2 circuit state</text><text x="536" y="296" class="sub" text-anchor="start">Node v · capacitor C</text><text x="536" y="310" class="sub" text-anchor="start">Bulb + R_sense; state w</text></g><g data-node-id="observe"><rect data-role="bounds" x="768" y="232" width="160" height="96" rx="6" class="box"/><text x="784" y="252" class="tag" text-anchor="start">OBSERVE</text><text x="784" y="276" class="name" text-anchor="start">Sensors</text><text x="784" y="296" class="sub" text-anchor="start">A1 light · A2 current</text><text x="784" y="310" class="sub" text-anchor="start">A3 node voltage</text></g><g data-node-id="board"><rect data-role="bounds" x="768" y="416" width="160" height="88" rx="6" class="box"/><text x="784" y="436" class="tag" text-anchor="start">BOARD</text><text x="784" y="460" class="name" text-anchor="start">Acquire</text><text x="784" y="480" class="sub" text-anchor="start">ADC + flash events</text><text x="784" y="494" class="sub" text-anchor="start">Clock / scale / drops</text></g><g data-node-id="record"><rect data-role="bounds" x="520" y="416" width="192" height="88" rx="6" class="box"/><text x="536" y="436" class="tag" text-anchor="start">RECORD</text><text x="536" y="460" class="name" text-anchor="start">Save trial</text><text x="536" y="480" class="sub" text-anchor="start">Host: input + settings</text><text x="536" y="494" class="sub" text-anchor="start">Raw arrays + provenance</text></g><text x="32" y="424" class="group" text-anchor="start">What is grouped?</text><text x="32" y="448" class="small" text-anchor="start">Photodiode, current sense and divider become one sensor block.</text><text x="32" y="468" class="small" text-anchor="start">Filters, protection and pin details stay in the architecture text.</text><line x1="32" y1="548" x2="928" y2="548" class="rule"/><text x="32" y="572" class="small" text-anchor="start">Arrows show signal / record direction. The dashed region is the biased circuit, not galvanic isolation.</text></svg></div><p class="note">Grouped: light/current/divider sensing and supply filter/bias parts. Preserved: input sources, coupling, both capacitor states, three measured channels, flash events and recording metadata. Functional overview only; not a verified wiring schematic.</p></main></body></html>
