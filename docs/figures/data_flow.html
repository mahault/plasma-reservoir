<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Input-to-results flow</title><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet"><style>
:root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#5a6580; --accent:#bf4520; --tint:#f4e7e2; --font-sans:'Geist',system-ui,sans-serif; --font-mono:'Geist Mono',ui-monospace,monospace; --font-serif:'Instrument Serif',Georgia,serif; }
* { box-sizing:border-box; } body { margin:0; padding:24px; background:var(--paper); color:var(--ink); font-family:var(--font-sans); }
.frame { width:100%; max-width:1040px; min-width:0; margin:0 auto; } .diagram-container { width:100%; overflow-x:auto; } svg { width:100%; min-width:960px; display:block; }
h1 { font-family:var(--font-serif); font-weight:400; font-size:28px; margin:0 0 16px; } .note { font-size:14px; line-height:1.6; max-width:80ch; }
svg .paper { fill:var(--paper); } svg text { fill:var(--ink); font-family:var(--font-sans); } svg .figure-title { font-family:var(--font-serif); font-size:28px; font-weight:400; }
svg .name { font-size:12px; font-weight:600; } svg .sub { font-family:var(--font-mono); font-size:9px; fill:var(--muted); } svg .tag { font-family:var(--font-mono); font-size:8px; letter-spacing:1px; fill:var(--soft); }
svg .group { font-size:14px; font-weight:600; } svg .small { font-size:11px; fill:var(--muted); } svg .box { fill:var(--paper); stroke:var(--muted); stroke-width:1.2; } svg .focal { fill:var(--tint); stroke:var(--accent); stroke-width:1.8; }
svg .zone { fill:#f0f0f1; stroke:#bfc0c0; stroke-width:1; stroke-dasharray:4 4; } svg .wire { fill:none; stroke:var(--muted); stroke-width:1.4; marker-end:url(#arrow); }
svg .secondary { fill:none; stroke:var(--muted); stroke-width:1.2; stroke-dasharray:5 4; marker-end:url(#arrow); } svg .rule { stroke:#bfc0c0; stroke-width:1; }
@media print { body{padding:0} .diagram-container{overflow-x:visible} svg{min-width:0} }
</style></head><body><main class="frame"><h1>Input-to-results flow</h1><div class="diagram-container"><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data_flow-title data_flow-desc"><title id="data_flow-title">Input-to-results flow</title><desc id="data_flow-desc">A known input produces a response saved as a trial, transformed into features, analysed or fitted, then compared with controls and test data.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#4f5d75"/></marker></defs><rect width="960" height="600" class="paper"/><text x="36" y="52" class="figure-title" text-anchor="start">Follow the data from drive to result</text><text x="36" y="80" class="small" text-anchor="start">Hardware and simulation use the same recorded-trial and analysis definitions.</text><text x="36" y="148" class="group" text-anchor="start">Record first. Extract features. Compare against controls.</text><path d="M164 292H188" class="wire"/><path d="M316 292H340" class="wire"/><path d="M468 292H492" class="wire"/><path d="M620 292H644" class="wire"/><path d="M772 292H796" class="wire"/><path d="M100 340V404Q100 412 108 412H700Q708 412 708 404V340" class="secondary"/><rect x="336" y="420" width="112" height="16" class="paper"/><text x="392.0" y="431" class="tag" text-anchor="middle">KNOWN TARGETS</text><g data-node-id="01 input"><rect data-role="bounds" x="36" y="244" width="128" height="96" rx="6" class="box"/><text x="52" y="264" class="tag" text-anchor="start">01 INPUT</text><text x="52" y="288" class="name" text-anchor="start">Known input</text><text x="52" y="308" class="sub" text-anchor="start">u(k) / audio</text><text x="52" y="322" class="sub" text-anchor="start">seed; labels</text></g><g data-node-id="02 response"><rect data-role="bounds" x="188" y="244" width="128" height="96" rx="6" class="box"/><text x="204" y="264" class="tag" text-anchor="start">02 RESPONSE</text><text x="204" y="288" class="name" text-anchor="start">Response</text><text x="204" y="308" class="sub" text-anchor="start">physical bulb</text><text x="204" y="322" class="sub" text-anchor="start">or model</text></g><g data-node-id="03 record"><rect data-role="bounds" x="340" y="244" width="128" height="96" rx="6" class="box"/><text x="356" y="264" class="tag" text-anchor="start">03 RECORD</text><text x="356" y="288" class="name" text-anchor="start">Trial record</text><text x="356" y="308" class="sub" text-anchor="start">samples; events</text><text x="356" y="322" class="sub" text-anchor="start">timing; setup</text></g><g data-node-id="04 extract"><rect data-role="bounds" x="492" y="244" width="128" height="96" rx="6" class="box"/><text x="508" y="264" class="tag" text-anchor="start">04 EXTRACT</text><text x="508" y="288" class="name" text-anchor="start">Features</text><text x="508" y="308" class="sub" text-anchor="start">means; flashes</text><text x="508" y="322" class="sub" text-anchor="start">chosen windows</text></g><g data-node-id="05 analyse"><rect data-role="bounds" x="644" y="244" width="128" height="96" rx="6" class="focal"/><text x="660" y="264" class="tag" text-anchor="start">05 ANALYSE</text><text x="660" y="288" class="name" text-anchor="start">Analyse / fit</text><text x="660" y="308" class="sub" text-anchor="start">capacity; repeats</text><text x="660" y="322" class="sub" text-anchor="start">task readout</text></g><g data-node-id="06 evaluate"><rect data-role="bounds" x="796" y="244" width="128" height="96" rx="6" class="box"/><text x="812" y="264" class="tag" text-anchor="start">06 EVALUATE</text><text x="812" y="288" class="name" text-anchor="start">Compare</text><text x="812" y="308" class="sub" text-anchor="start">controls; test set</text><text x="812" y="322" class="sub" text-anchor="start">MC / IPC / NMSE</text></g><text x="36" y="476" class="small" text-anchor="start">Only the task readout is trained; capacity and repeat diagnostics use the recorded features.</text><line x1="36" y1="524" x2="924" y2="524" class="rule"/><line x1="36" y1="552" x2="68" y2="552" class="wire"/><text x="80" y="556" class="small" text-anchor="start">record / feature flow</text><line x1="340" y1="552" x2="372" y2="552" class="secondary"/><text x="384" y="556" class="small" text-anchor="start">targets derived from known input or labels</text></svg></div><p class="note">Condensed: capture integrity into Trial record; capacity/repeat diagnostics and readout fitting into Analyse / fit. The separate target path is retained. Source-specific details, units and uncertainty limits are in architecture.md.</p></main></body></html>
